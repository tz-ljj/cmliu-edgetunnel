name: Sync upstream and deploy bookis

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *' # 04:23 China Standard Time; GitHub schedules may be delayed.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bookis-production
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    if: github.repository == 'tz-ljj/cmliu-edgetunnel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test synchronization and configuration checks
        run: node --test .github/tests/*.test.mjs

      - name: Fetch and validate upstream source
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --depth=1 upstream main
          bash .github/scripts/sync-upstream.sh

      - name: Commit synchronized source
        id: sync
        run: |
          if ! git diff --cached --quiet; then
            upstream_sha=$(git rev-parse refs/remotes/upstream/main)
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Sync cmliu/edgetunnel@$upstream_sha"
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record current deployment and inspect production configuration
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_COMMIT: ${{ steps.sync.outputs.commit }}
        run: node .github/scripts/pages-project.mjs

      - name: Prepare isolated Pages upload
        if: steps.inspect.outputs.deploy_needed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bookis-deploy/public"
          # shortcut: upload the single-file runtime; expand this if upstream adds runtime files.
          cp _worker.js "$RUNNER_TEMP/bookis-deploy/public/_worker.js"
          # Upstream wrangler.toml targets Workers; never apply it to this Pages project.

      - name: Deploy synchronized commit to existing Pages project
        if: steps.inspect.outputs.deploy_needed == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: ${{ runner.temp }}/bookis-deploy
          command: >-
            pages deploy public --project-name=bookis --branch=main
            --commit-hash=${{ steps.sync.outputs.commit }}
            --commit-message="Deploy synchronized edgetunnel source"

      - name: Verify deployment and unchanged production configuration
        if: steps.inspect.outputs.deploy_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_COMMIT: ${{ steps.sync.outputs.commit }}
          EXPECTED_CONFIGURATION: ${{ steps.inspect.outputs.configuration }}
        run: node .github/scripts/pages-project.mjs

      - name: Report no deployment needed
        if: steps.inspect.outputs.deploy_needed == 'false'
        run: echo 'Source and production commit already match; no deployment needed.' >> "$GITHUB_STEP_SUMMARY"
